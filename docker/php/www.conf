; Umar Techy E-Commerce — PHP-FPM pool (loaded after the image's own www.conf).
[www]
; Laravel reads its settings from the container's environment (there is no
; .env file in the image), so the environment must reach PHP.
clear_env = no

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
; Recycle workers now and then, so a slow leak cannot grow without end.
pm.max_requests = 500

; The container health check asks for this (cgi-fcgi).
ping.path = /fpm-ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 120s
