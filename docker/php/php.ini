; Umar Techy E-Commerce — PHP settings for the production containers.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Invoice PDFs (dompdf) need more than the default 128M.
memory_limit = 512M
max_execution_time = 60

; Product pictures and logos are up to 5 MB each; CSV imports up to 4 MB;
; several pictures can go in one request.
upload_max_filesize = 12M
post_max_size = 24M
max_file_uploads = 20

date.timezone = UTC
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Code only changes with a new image, so files are never re-checked.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

session.cookie_httponly = 1
