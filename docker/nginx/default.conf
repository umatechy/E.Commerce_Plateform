# Umar Techy E-Commerce — the web container (docker-compose.prod.yml, service "web").
#
# Sits behind the server's own Nginx (deploy/nginx/ecommerce-site.conf.example),
# which ends HTTPS and forwards to 127.0.0.1:<port> with X-Forwarded-For and
# X-Forwarded-Proto. Every host is passed to Laravel unchanged: the app, not
# Nginx, decides which store a host belongs to.

# Docker's DNS, so a recreated app container is found again.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 24m;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    # Liveness of this container only (the app's own check is /api/v1/health).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No dotfiles (.env, .git, .htaccess), except ACME challenges.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Built assets carry a content hash in their names.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Uploaded public files (storage/app/public). Anything else under
    # /storage/ (signed private downloads) is Laravel's.
    location /storage/ {
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Only the front controller runs; no other PHP file is reachable.
    location = /index.php {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ \.php$ {
        return 404;
    }
}
