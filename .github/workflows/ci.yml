name: CI

on:
  push:
    branches: [main, develop, v1.1]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: umartechy_ecommerce_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, redis, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Static analysis (PHPStan / Larastan)
        run: composer stan

      # Phase B53 (SRS API-012; Module 31 §65): the committed OpenAPI file matches the code.
      - name: OpenAPI description is up to date
        run: php artisan api:openapi --check

      # Phase B54 (Module 34 §57): help articles and release notes — metadata, links to
      # articles, pages and API paths, troubleshooting structure, secret and personal-data scan.
      - name: Help content checks
        run: php artisan help:check

      - name: Run migrations (test DB)
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: umartechy_ecommerce_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: PHPUnit / Laravel Feature Tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: umartechy_ecommerce_test
          DB_USERNAME: root
          DB_PASSWORD: ""
          REDIS_HOST: 127.0.0.1

  # SRS SEC-013 / SEC-014, Module 32 §48 (Phase B29): known-vulnerability
  # scan of the dependencies. A finding fails the build.
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Reads composer.lock; fails on any advisory, in any PHP package.
      - name: PHP dependencies (composer audit)
        run: composer audit --locked

      # The packages that ship to browsers and servers. High and critical
      # advisories fail the build.
      - name: JavaScript dependencies that ship (npm audit)
        run: npm audit --omit=dev --audit-level=high

      # Build and test tooling never ships. Phase B52 upgraded it (Vite 8,
      # Vitest 5): a critical advisory now fails the build. The remaining
      # high ones are in Tailwind CSS 3's file watching (braces, micromatch),
      # fixed only by Tailwind 4 — listed here until that migration
      # (docs/security/b52-security-review.md).
      - name: JavaScript build tooling (critical fails)
        run: npm audit --audit-level=critical
      - name: JavaScript build tooling (all, report only)
        run: npm audit --audit-level=high
        continue-on-error: true

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

      # Phase B53: the OpenAPI description is valid (Redocly, pinned).
      - name: Lint the OpenAPI description
        run: npx --yes @redocly/cli@2.63.0 lint docs/api/openapi-developer-v1.json

  # Deployment: the production images and Compose project, built and run as
  # on the server (deploy/production/deploy.sh), with CI-only secrets. Checks
  # the image (extensions, MySQL client, no .env inside, non-root), the health
  # endpoint through the web container, compiled CSS, public storage, and a
  # real encrypted backup made by the queue worker, verified and rehearsed.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Production settings with throwaway CI secrets
        run: |
          cp deploy/production/env.production.example .env
          set_env() { sed -i "s#^$1=.*#$1=$2#" .env; }
          set_env ECOM_HTTP_PORT 18085
          set_env APP_URL http://127.0.0.1:18085
          set_env APP_KEY "base64:$(openssl rand -base64 32)"
          set_env DB_PASSWORD "$(openssl rand -hex 20)"
          set_env REDIS_PASSWORD "$(openssl rand -hex 20)"
          set_env BACKUP_ENCRYPTION_KEY "$(openssl rand -base64 32)"
          set_env SANCTUM_STATEFUL_DOMAINS 127.0.0.1:18085
          set_env PLATFORM_BASE_DOMAIN stores.ci.invalid
          set_env STOREFRONT_BASE_URL http://127.0.0.1:18085/shop
          set_env MAIL_FROM_ADDRESS ci@umartechy.invalid
          # Plain HTTP in CI only.
          set_env SESSION_SECURE_COOKIE false
          # As on the server: an existing proxy's network the shop's web container joins.
          set_env SHARED_PROXY_NETWORK ci_shared_proxy
          docker network create ci_shared_proxy
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 20)" > mysql.env
          chmod 600 .env mysql.env

      - name: Read-only preflight (as on the server)
        run: bash deploy/production/preflight.sh 18085 172.30.240.0/24

      - name: Deploy (first install) with the production script
        run: bash deploy/production/deploy.sh --first-install

      - name: The image
        run: |
          tag="$(cat .deployed-tag)"
          docker run --rm --entrypoint php "umartechy-ecom-app:$tag" -r '
            $gd = gd_info();
            foreach (["pdo_mysql", "redis", "sodium", "intl", "pcntl", "zip", "bcmath", "gd", "exif", "mbstring", "Zend OPcache"] as $ext) { if (! extension_loaded($ext)) { fwrite(STDERR, "missing $ext\n"); exit(1); } }
            if (! $gd["JPEG Support"] || ! $gd["PNG Support"] || ! $gd["WebP Support"]) { fwrite(STDERR, "gd without JPEG/PNG/WebP\n"); exit(1); }
            echo "extensions ok\n";'
          docker run --rm --entrypoint sh "umartechy-ecom-app:$tag" -c 'mysqldump --version && mysql --version && test ! -e .env && test ! -e mysql.env && test "$(id -u)" = 1000 && echo "image ok"'

      - name: Smoke test through the published port
        run: |
          base=http://127.0.0.1:18085
          curl -fsS "$base/api/v1/public/health" | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o login.html -w '%{http_code}\n' "$base/login"
          css="$(grep -oE '/build/assets/[^"]+\.css' login.html | head -1)"
          test -n "$css"
          curl -fsS "$base$css" -o app.css
          ! grep -q '@tailwind' app.css
          grep -q -- '--tw-' app.css
          echo "compiled CSS ok ($css)"
          # Public uploads are served from the shared storage volume.
          docker compose -p umartechy-ecom -f docker-compose.prod.yml exec -T app sh -c 'echo ci-upload > storage/app/public/ci-check.txt'
          curl -fsS "$base/storage/ci-check.txt" | grep -q ci-upload
          # Nothing but the front controller runs PHP; dotfiles are refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/.env")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/server.php")" = 404

      - name: Reached from the shared proxy network, without taking another app's names
        run: |
          # How School ERP's Nginx container reaches the shop.
          docker run --rm --network ci_shared_proxy curlimages/curl:8.11.1 -fsS http://umartechy-shop-web:8080/api/v1/public/health | grep -q '"status":"ok"'
          # Generic names must not appear there (School ERP's Nginx proxies to "web").
          for name in web app mysql redis worker scheduler; do
            if docker run --rm --network ci_shared_proxy alpine:3.20 getent hosts "$name" >/dev/null; then
              echo "\"$name\" resolves on the shared network"; exit 1
            fi
          done
          echo "shared network ok"

      - name: A real backup by the worker, verified and rehearsed
        run: |
          dc="docker compose -p umartechy-ecom -f docker-compose.prod.yml"
          id="$($dc exec -T app php artisan tinker --execute 'echo app(\App\Domain\DataProtection\Services\BackupService::class)->requestScheduled(now("UTC"))["backup"]->public_id;' | tail -1)"
          echo "backup $id"
          for i in $(seq 1 60); do
            status="$($dc exec -T app php artisan tinker --execute "echo \App\Domain\DataProtection\Models\Backup::query()->where('public_id', '$id')->first()->status->value;" | tail -1)"
            echo "status: $status"
            [ "$status" = verified ] && break
            [ "$status" = failed ] && exit 1
            sleep 5
          done
          test "$status" = verified
          $dc exec -T app php artisan backups:verify --deep
          $dc exec -T app php artisan backups:rehearse --backup="$id" --force

      - name: Second deploy (update path, with the pre-deploy dump)
        run: |
          bash deploy/production/deploy.sh
          ls -l backups/
          test -s "$(ls backups/pre-deploy-*.sql.gz | head -1)"

      - name: Off-server backups to an S3-compatible bucket (S3Mock standing in for Hetzner Object Storage)
        run: |
          docker run -d --name ci-s3 --network umartechy-ecom_data -e initialBuckets=ci-backups adobe/s3mock:latest
          for i in $(seq 1 45); do
            docker run --rm --network umartechy-ecom_data curlimages/curl:8.11.1 -fsS http://ci-s3:9090/ci-backups >/dev/null && break
            sleep 2
          done
          # Settings as on the server; the keys through set-secret.sh, as the owner will enter them.
          sed -i 's#^BACKUP_DISK=.*#BACKUP_DISK=backups_s3#' .env
          printf '%s\n' 'BACKUP_S3_ENDPOINT=http://ci-s3:9090' 'BACKUP_S3_REGION=us-east-1' 'BACKUP_S3_BUCKET=ci-backups' 'BACKUP_S3_PATH_STYLE=true' >> .env
          printf 'ciaccesskey\r\n' | bash deploy/production/set-secret.sh BACKUP_S3_ACCESS_KEY
          printf 'ci-secret-key-123456\n' | bash deploy/production/set-secret.sh BACKUP_S3_SECRET_KEY
          stat -c '%a' .env | grep -qx 600
          bash deploy/production/deploy.sh
          dc="docker compose -p umartechy-ecom -f docker-compose.prod.yml"
          # A manual platform backup (today's scheduled one already exists), made by the worker.
          id="$($dc exec -T app php artisan tinker --execute 'echo app(\App\Domain\DataProtection\Services\BackupService::class)->requestBackup(\App\Domain\DataProtection\Models\BackupScope::Platform, null, \App\Domain\DataProtection\Models\BackupInitiator::Manual, null)->public_id;' | tail -1)"
          echo "s3 backup $id"
          for i in $(seq 1 60); do
            status="$($dc exec -T app php artisan tinker --execute "echo \App\Domain\DataProtection\Models\Backup::query()->where('public_id', '$id')->first()->status->value;" | tail -1)"
            echo "status: $status"
            [ "$status" = verified ] && break
            [ "$status" = failed ] && { $dc logs --tail=50 worker; exit 1; }
            sleep 5
          done
          test "$status" = verified
          disk="$($dc exec -T app php artisan tinker --execute "echo \App\Domain\DataProtection\Models\Backup::query()->where('public_id', '$id')->value('storage_disk') ?? config('backup.disk');" | tail -1)"
          echo "stored on: $disk"
          $dc exec -T app php artisan backups:verify --deep
          $dc exec -T app php artisan backups:rehearse --backup="$id" --force
          test "$disk" = backups_s3
          # The artifact is really in the bucket.
          docker run --rm --network umartechy-ecom_data curlimages/curl:8.11.1 -fsS http://ci-s3:9090/ci-backups | tee bucket.xml
          grep -q '<Key>' bucket.xml

      - name: Logs when something failed
        if: failure()
        run: docker compose -p umartechy-ecom -f docker-compose.prod.yml logs --tail=200

  # Phase B53 (SRS TEST-009; Module 31 §65): the critical journeys in a real
  # browser against the running app — guest checkout, customer account,
  # owner sign-in with two-step code, developer API — on the built assets.
  e2e:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: umartechy_ecommerce_e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      DB_HOST: 127.0.0.1
      DB_DATABASE: umartechy_ecommerce_e2e
      DB_USERNAME: root
      DB_PASSWORD: ""
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_DOMAIN: ""
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Build the frontend
        run: npm run build

      - name: Prepare the app and its test data
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force
          php artisan e2e:prepare

      - name: Start the app
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/login > /dev/null && break; sleep 1; done

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm run e2e

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            storage/logs/
          retention-days: 7

