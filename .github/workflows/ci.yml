name: CI

on:
  push:
    branches: [main, develop, v1.1]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: umartechy_ecommerce_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, redis, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Static analysis (PHPStan / Larastan)
        run: composer stan

      - name: Run migrations (test DB)
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: umartechy_ecommerce_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: PHPUnit / Laravel Feature Tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: umartechy_ecommerce_test
          DB_USERNAME: root
          DB_PASSWORD: ""
          REDIS_HOST: 127.0.0.1

  # SRS SEC-013 / SEC-014, Module 32 §48 (Phase B29): known-vulnerability
  # scan of the dependencies. A finding fails the build.
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Reads composer.lock; fails on any advisory, in any PHP package.
      - name: PHP dependencies (composer audit)
        run: composer audit --locked

      # The packages that ship to browsers and servers. High and critical
      # advisories fail the build.
      - name: JavaScript dependencies that ship (npm audit)
        run: npm audit --omit=dev --audit-level=high

      # Build and test tooling (Vite, Vitest, esbuild) never ships. Its
      # advisories are listed on every run but do not fail the build until
      # the toolchain upgrade recorded in
      # docs/security/b29-security-baseline.md is done.
      - name: JavaScript build tooling (report only)
        run: npm audit --audit-level=high
        continue-on-error: true

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

  # Playwright E2E intentionally not run in CI yet (Milestone-0 Step
  # 0.9: "prepare Playwright architecture but do not build a huge E2E
  # suite yet"). Added once storefront/checkout flows exist (Phase B7+).
